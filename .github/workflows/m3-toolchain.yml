name: M3 isolated development toolchain
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/m3-toolchain.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Restore only the pinned dependency graph
        run: |
          dotnet tool restore
          dotnet restore SaasOne.slnx --locked-mode
      - name: Package exact public toolchain and locked packages only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/development
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          tar -czf artifacts/development/dotnet.tar.gz -C "$root" dotnet host/fxr/10.0.14 shared/Microsoft.NETCore.App/10.0.14 shared/Microsoft.AspNetCore.App/10.0.14 sdk/10.0.403 packs/Microsoft.NETCore.App.Ref/10.0.14 packs/Microsoft.AspNetCore.App.Ref/10.0.14 packs/Microsoft.NETCore.App.Host.linux-x64/10.0.14 packs/NETStandard.Library.Ref/2.1.0
          python3 - <<'PY'
          import json, pathlib, tarfile
          cache=pathlib.Path.home()/'.nuget/packages'
          selected=set()
          for file in pathlib.Path('.').rglob('packages.lock.json'):
              for graph in json.loads(file.read_text())['dependencies'].values():
                  for name, package in graph.items():
                      if package['type'].lower() != 'project':
                          selected.add(cache/name.lower()/package['resolved'])
          for path in (cache/'dotnet-ef', cache/'.tools/dotnet-ef'):
              if path.exists(): selected.add(path)
          with tarfile.open('artifacts/development/nuget.tar.gz','w:gz',compresslevel=1) as archive:
              for path in sorted(selected):
                  if not path.is_dir(): raise RuntimeError('missing locked package '+str(path.name))
                  archive.add(path,arcname='packages/'+str(path.relative_to(cache)))
          PY
          cp "$RUNNER_TEMP/pwsh.tar.gz" artifacts/development/pwsh.tar.gz
          git rev-parse HEAD > artifacts/development/source-sha.txt
          (cd artifacts/development && sha256sum *.tar.gz > SHA256SUMS && split -b 200M -d nuget.tar.gz nuget-part- && rm nuget.tar.gz && ls -lh)
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m3-sdk
          path: |
            artifacts/development/dotnet.tar.gz
            artifacts/development/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m3-pwsh
          path: artifacts/development/pwsh.tar.gz
          retention-days: 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m3-nuget-00
          path: artifacts/development/nuget-part-00
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: hashFiles('artifacts/development/nuget-part-01') != ''
        with:
          name: m3-nuget-01
          path: artifacts/development/nuget-part-01
          retention-days: 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: hashFiles('artifacts/development/nuget-part-02') != ''
        with:
          name: m3-nuget-02
          path: artifacts/development/nuget-part-02
          retention-days: 1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: hashFiles('artifacts/development/nuget-part-03') != ''
        with:
          name: m3-nuget-03
          path: artifacts/development/nuget-part-03
          retention-days: 1
