name: M0 lock bootstrap
on:
  push:
    branches: [feat/m0-foundation]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Install pinned PowerShell
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/powershell-7.6.9-linux-x64.tar.gz -o "$RUNNER_TEMP/pwsh.tar.gz"
          echo "1da6d6d6035d651f20e70ddee7c4c15ac6ab8b9fb40ee92240d91263f28a884b  $RUNNER_TEMP/pwsh.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf "$RUNNER_TEMP/pwsh.tar.gz" -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Generate genuine NuGet locks and dependency evidence
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info
          pwsh --version
          dotnet tool restore
          dotnet restore SaasOne.slnx --force-evaluate
          mkdir -p docs/compatibility
          python3 - <<'PY'
          import glob,json,pathlib
          projects={}
          for file in sorted(glob.glob('**/packages.lock.json',recursive=True)):
              lock=json.loads(pathlib.Path(file).read_text())
              projects[file]={tfm:{name:{k:v for k,v in data.items() if k in ('type','resolved','dependencies','contentHash')} for name,data in deps.items()} for tfm,deps in lock['dependencies'].items()}
          if not projects: raise SystemExit('No locks generated')
          pathlib.Path('docs/compatibility/resolved-packages.json').write_text(json.dumps({'generatedBy':'dotnet restore; do not hand-edit','projects':projects},indent=2)+'\n')
          PY
          git add '**/packages.lock.json' docs/compatibility/resolved-packages.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'build: generate M0 NuGet locks from pinned toolchain'
            git push origin HEAD:feat/m0-foundation
          fi
      - name: Build and execute red tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          git rev-parse HEAD > artifacts/bootstrap/source-sha.txt
          dotnet build SaasOne.slnx --configuration Release --no-restore
          dotnet test SaasOne.slnx --configuration Release --no-build --logger trx --results-directory artifacts/bootstrap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: m0-bootstrap-${{ github.run_id }}
          path: artifacts/bootstrap
          if-no-files-found: warn
