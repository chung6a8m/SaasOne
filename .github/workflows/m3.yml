name: M3 authorization lifecycle and audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive only tracked source for reproducible inspection
        run: |
          mkdir -p artifacts/source
          git rev-parse HEAD > artifacts/source/commit.txt
          git archive --format=tar.gz --output=artifacts/source/source.tar.gz HEAD
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m3-source-${{ github.sha }}
          path: artifacts/source
          if-no-files-found: error
          retention-days: 7
  acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Inherited baseline and mandatory M3 gate
        shell: pwsh
        run: |
          if (Test-Path scripts/check-m3.ps1) { ./scripts/check-m3.ps1 }
          else {
              ./scripts/check-m2.ps1
              throw 'M3 implementation gate is not installed; baseline alone is not acceptance.'
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m3-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/verification
            artifacts/test-results
          if-no-files-found: error
