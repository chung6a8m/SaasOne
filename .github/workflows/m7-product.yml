name: M7 independent product reuse acceptance
on:
  push:
    branches: [main, codex/m7-acceptance]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m7-product-${{ github.ref }}
  cancel-in-progress: true
jobs:
  product:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Independent locked product, graph, template and real SQL startup
        shell: pwsh
        run: |
          ./scripts/check-m7-product.ps1
          exit $LASTEXITCODE
      - name: Hash safe evidence
        if: always()
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/m7-evidence -File)
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name } | Set-Content artifacts/m7-evidence/SHA256SUMS -Encoding utf8NoBOM
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m7-product-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/m7-evidence/
          if-no-files-found: error
          retention-days: 7
