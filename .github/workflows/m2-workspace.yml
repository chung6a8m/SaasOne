name: M2 offline build inputs
on:
  push:
    branches: [feat/m2-identity-poc]
    paths: [.github/workflows/m2-workspace.yml]
permissions:
  contents: read
  actions: read
jobs:
  inputs:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Split already verified public build inputs into bounded artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p parts
          curl --max-time 300 -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/chung6a8m/SaasOne/actions/artifacts/13521657234/zip -o inputs.zip
          echo 'a3806a4caf4eeb860a64876b53dc2054a2b1bf5f197636cdbcdf195e9120e799  inputs.zip' | sha256sum --check
          split -b 350M -d -a 2 inputs.zip parts/inputs.part
          sha256sum parts/* > parts/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m2-inputs-part00
          path: |
            parts/inputs.part00
            parts/SHA256SUMS
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m2-inputs-part01
          path: parts/inputs.part01
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m2-inputs-part02
          path: parts/inputs.part02
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
