name: M2 identity PoC
on:
  push:
    branches: [main, feat/m2-identity-poc]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  poc-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Foundation, inherited SQL gates and complete M2 identity acceptance
        shell: bash
        run: |
          mkdir -p artifacts/logs
          pwsh -NoProfile -File scripts/check-m2.ps1 > artifacts/logs/m2.log 2>&1 || { tail -120 artifacts/logs/m2.log; exit 1; }
          tail -40 artifacts/logs/m2.log
      - name: Retain concise machine-readable gate evidence even on failure
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/verification/m2-poc.json) {
              Get-Content artifacts/verification/m2-poc.json -Raw
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m2-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/verification
            artifacts/test-results
            artifacts/logs
          if-no-files-found: error
