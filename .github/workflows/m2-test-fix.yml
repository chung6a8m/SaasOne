name: M2 one-time analyzer correction
on:
  push:
    branches: [feat/m2-identity-poc]
    paths: ['.github/workflows/m2-test-fix.yml']
permissions:
  contents: write
concurrency:
  group: m2-one-time-test-fix
  cancel-in-progress: false
jobs:
  correct:
    if: github.ref == 'refs/heads/feat/m2-identity-poc'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/m2-identity-poc
          persist-credentials: true
      - uses: ./.github/actions/pinned-toolchain
      - name: Apply the three exact analyzer corrections and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'tests/Unit/SaaS.UnitTests/IdentityPoc/IdentityRefreshTests.cs': [
                  ('Assert.Single(responses.Where(x => x.StatusCode == HttpStatusCode.OK));', 'Assert.Single(responses, x => x.StatusCode == HttpStatusCode.OK);'),
                  ('Assert.Single(responses.Where(x => x.StatusCode == HttpStatusCode.BadRequest));', 'Assert.Single(responses, x => x.StatusCode == HttpStatusCode.BadRequest);')],
              'tests/Unit/SaaS.UnitTests/IdentityPoc/IdentitySecurityTests.cs': [
                  ('db.IdentityMemberships.AnyAsync(x => x.GlobalUserId == secondId || x.GlobalUserId == thirdId)', 'db.IdentityMemberships.AnyAsync(x => x.GlobalUserId == secondId || x.GlobalUserId == thirdId, TestContext.Current.CancellationToken)')]
          }
          for name, replacements in changes.items():
              path = Path(name)
              text = path.read_text()
              for old, new in replacements:
                  assert text.count(old) == 1, 'Unexpected source; do not guess a patch.'
                  text = text.replace(old, new)
              path.write_text(text)
          Path('.github/workflows/m2-test-fix.yml').unlink()
          PY
          git add tests/Unit/SaaS.UnitTests/IdentityPoc/IdentityRefreshTests.cs tests/Unit/SaaS.UnitTests/IdentityPoc/IdentitySecurityTests.cs .github/workflows/m2-test-fix.yml
          git config user.name 'SaasOne build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(M2): use predicate assertions and propagate query cancellation'
          git push origin HEAD:refs/heads/feat/m2-identity-poc
      - name: Verify the corrected exact source without weakening any gate
        shell: pwsh
        run: ./scripts/check-m2.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m2-correction-verification-${{ github.run_id }}
          path: |
            artifacts/verification
            artifacts/test-results
          if-no-files-found: error
