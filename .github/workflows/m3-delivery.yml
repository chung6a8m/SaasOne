# Temporary, exact-base transport for the isolated M3 branch. Remove before review.
name: M3 source delivery and SQL red evidence
on:
  pull_request:
    branches: [main]
    paths: ['.github/m3-delivery/**', '.github/workflows/m3-delivery.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'codex/m3-authorization-lifecycle-audit'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Verify exact base and source patch before applying
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = ef0b0718b050c8f0f55a4ac41318960f47a1b75d
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded=''.join(pathlib.Path('.github/m3-delivery/'+n).read_text() for n in ('00','01','02'))
          patch=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=256*1024*1024)
          assert len(patch)==202521
          assert hashlib.sha256(patch).hexdigest()=='192fe0a80b42b4b144287621c26e1accbc6fcca275f10ec302f4348b7bad76fe'
          target=pathlib.Path('/tmp/m3-source.patch'); target.write_bytes(patch)
          for line in subprocess.check_output(['git','apply','--numstat',str(target)],text=True).splitlines():
              path=line.split('\t')[2]
              assert path.startswith(('src/','tests/','scripts/','docs/','tools/')) and '..' not in pathlib.PurePosixPath(path).parts
          PY
          git rm src/Platform/SaaS.AccessControl/PermissionPolicy.cs tests/Unit/SaaS.UnitTests/M3PermissionPolicyTests.cs
          git apply --check --index /tmp/m3-source.patch
          git apply --index /tmp/m3-source.patch
          git rm -r .github/m3-delivery
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(m3): implement deny-first policy and owned ACL audit schemas; specify SQL gate tests'
          git push origin HEAD:refs/heads/codex/m3-authorization-lifecycle-audit
          git rev-parse HEAD
      - uses: ./.github/actions/pinned-toolchain
      - name: Build exact delivered source and execute SQL red tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore SaasOne.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'locked restore failed' }
          dotnet build SaasOne.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'build failed' }
          ./scripts/m3-sql-fixture.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m3-sql-red-delivered-source
          path: |
            artifacts/verification
            artifacts/test-results
          retention-days: 7
          if-no-files-found: error
