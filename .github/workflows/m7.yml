name: M7 implementation verification
on:
  push:
    branches: [codex/m7-acceptance-reuse]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: m7-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Archive tracked source only, without credentials or local state
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          mkdir -p artifacts/m7-source
          git rev-parse HEAD > artifacts/m7-source/source-sha.txt
          git archive --format=zip --output=artifacts/m7-source/source.zip HEAD
          cd artifacts/m7-source
          sha256sum source.zip > source.zip.sha256
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: m7-source-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/m7-source/
          if-no-files-found: error
          retention-days: 7
  product-contracts:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/pinned-toolchain
      - name: Restore and build pinned solution
        shell: pwsh
        run: |
          dotnet restore SaasOne.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build SaasOne.slnx --configuration Release --no-restore
          exit $LASTEXITCODE
      - name: Independent product source contract
        shell: pwsh
        run: |
          dotnet test tests/Architecture/SaaS.ArchitectureTests/SaaS.ArchitectureTests.csproj --configuration Release --no-build --filter FullyQualifiedName~M7ProductSourceTests --logger trx --results-directory artifacts/test-results/m7-contracts
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: m7-contracts-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/test-results/m7-contracts/
          if-no-files-found: error
          retention-days: 7
